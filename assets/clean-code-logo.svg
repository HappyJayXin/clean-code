<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deleteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#4ECDC4" />
    </linearGradient>
    <style>
      .delete-icon {
        fill: url(#deleteGradient);
        stroke: #2C3E50;
        stroke-width: 2;
      }
      .text {
        font-family: 'Arial', sans-serif;
        font-weight: bold;
        fill: #2C3E50;
      }
      .tagline {
        font-family: 'Arial', sans-serif;
        font-size: 12px;
        fill: #7F8C8D;
      }
    </style>
  </defs>
  
  <!-- Delete/Trash icon representing deletion -->
  <g transform="translate(50, 30)">
    <rect x="20" y="20" width="60" height="50" rx="5" class="delete-icon" />
    <path d="M30 25 L50 25 L55 30 L35 30 Z" class="delete-icon" />
    <path d="M35 35 L55 35 L50 40 L40 40 L35 35 Z" class="delete-icon" />
    <path d="M35 45 L55 45 L50 50 L40 50 L35 45 Z" class="delete-icon" />
  </g>
  
  <!-- Clean Code text -->
  <text x="100" y="120" font-size="18" text-anchor="middle" class="text">Clean Code</text>
  
  <!-- Tagline -->
  <text x="100" y="140" text-anchor="middle" class="tagline">Delete-Driven Development</text>
  
  <!-- Less Code, Less Bugs -->
  <text x="100" y="160" text-anchor="middle" class="tagline">Less Code, Less Bugs</text>
  
  <!-- Decorative elements - code brackets -->
  <text x="30" y="180" font-size="24" fill="#FF6B6B">{</text>
  <text x="170" y="180" font-size="24" fill="#4ECDC4">}</text>
</svg>